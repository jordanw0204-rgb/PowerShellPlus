name: Publish Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          )
          if (-not ($candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1)) {
            winget install --id JRSoftware.InnoSetup -e --source winget --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          }
          if (-not ($candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1)) {
            throw 'Inno Setup 6 was not installed.'
          }

      - name: Build and test application
        shell: pwsh
        # GitHub-hosted runners do not have an authenticated Codex CLI. All
        # deterministic gates still run; local builds keep the Codex gate on.
        run: ./build.ps1 -StageOnly -SkipCodexTests

      - name: Build and smoke-test installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./build-installer.ps1 -SkipAppBuild -RunSmokeTest -ExpectedVersion $version

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            build/installer/PowerShellPlus-Setup-x64.exe `
            build/installer/PowerShellPlus-Portable-x64.zip `
            build/installer/SHA256SUMS.txt `
            --verify-tag --generate-notes --latest `
            --title "PowerShellPlus $($env:GITHUB_REF_NAME.TrimStart('v'))"
